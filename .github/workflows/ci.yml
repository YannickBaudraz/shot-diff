name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The publish workflow runs these same checks before it publishes.
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      # GitHub's Ubuntu runners come with Google Chrome, which the tool uses by default.
      - run: npm test
      # The built command, as it is installed: bundling must keep the page's runtime self-contained.
      - run: node dist/cli.js "file://$PWD/test/fixtures/dashboard/before.html" "file://$PWD/test/fixtures/dashboard/after.html" --title CI --out "$RUNNER_TEMP/shots"

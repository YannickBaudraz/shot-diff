<style>
 body { font: 16px/1.5 system-ui, sans-serif; margin: 40px; width: 640px; color: #1f2328 }

<h1>Plans</h1>
<div class="plans">
  <section class="card"><h2>Free</h2><p>0 euros per month</p><div class="bar"><div style="width:20%"></div></div></section>
  <section class="card"><h2>Team</h2><p>9 euros per month</p><div class="bar"><div style="width:60%"></div></div></section>
</div>
